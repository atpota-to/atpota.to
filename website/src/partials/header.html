<header class="site-header" data-site-header>
  <a class="site-header__brand" href="/" aria-label="atpotato home" data-nav-brand data-nav="home">
    <!-- a little sky behind the wordmark, with the weather in it (src/scripts/nav-weather.ts):
         the sun's rays turn with how busy the network is, clouds come with the diversity index -->
    <span class="site-header__sky" aria-hidden="true" data-nav-sky>
      <!-- @svg weather-sun.svg class="site-header__sun weather-sun" -->
      <span class="weather-sky" data-weather-sky></span>
    </span>
    <!-- @svg wordmark.svg class="wordmark" -->
  </a>
  <button type="button" class="site-header__menu-btn" aria-expanded="false" aria-controls="site-menu" data-nav-toggle>
    <svg class="icon-menu" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <svg class="icon-close" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <span class="visually-hidden">menu</span>
  </button>
  <div class="site-menu" id="site-menu" data-nav-menu>
    <nav class="site-nav" aria-label="main">
      <ul class="site-nav__list" role="list">
        <li><a class="site-nav__link" href="/#projects" data-nav="projects">projects</a></li>
        <li><a class="site-nav__link" href="/blog" data-nav="blog">blog</a></li>
        <li><a class="site-nav__link" href="/garden" data-nav="garden">garden</a></li>
        <li><a class="site-nav__link" href="/weather" data-nav="weather">weather</a></li>
        <li><a class="site-nav__link" href="/about" data-nav="about">about</a></li>
      </ul>
    </nav>
    <div class="site-header__end">
      <!-- Desktop: a round sun/moon button. Phone sheet: a "dark mode" row with a switch.
           Same [data-theme-toggle] wiring as the footer's (src/scripts/theme.ts). -->
      <button type="button" class="nav-theme" aria-pressed="false" data-theme-toggle title="dark mode">
        <span class="nav-theme__icon" aria-hidden="true">
          <svg class="icon-sun" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <svg class="icon-moon" focusable="false" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
        </span>
        <span class="nav-theme__label">dark mode</span>
        <span class="nav-theme__track" aria-hidden="true"><span class="nav-theme__knob" data-theme-knob></span></span>
      </button>
      <!-- The reader's account (src/scripts/account.ts): a round "sign in", or their avatar. -->
      <div class="site-account" data-site-account></div>
      <!-- The "/" shortcut is in the title here, and in the panel's own footnote. -->
      <button type="button" class="btn btn--leaf ask-poe-btn" data-poe-open aria-keyshortcuts="/" title="ask poe (press /)">
        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18l-1 3 4-2h9a4 4 0 0 0 4-4V8a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v7a3 3 0 0 0 2 3z"/></svg>
        <span class="ask-poe-btn__label">ask poe</span>
      </button>
    </div>
  </div>
</header>
<div class="site-menu-scrim" data-nav-scrim hidden></div>
<!-- @partial signin -->
