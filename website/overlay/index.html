<!DOCTYPE html>
<html lang="en" data-theme="light" class="js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>stream overlay · atpotato</title>
    <meta name="description" content="poe and the atmosphere's weather, for your livestream: add this page to OBS as a browser source.">
    <link rel="icon" href="/favicon.png" type="image/png">

    <!-- Eigerdals (Adobe Fonts kit jik6ttx) -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin>
    <link rel="stylesheet" href="https://use.typekit.net/jik6ttx.css">

    <link rel="stylesheet" href="/src/styles/tokens.css">
    <link rel="stylesheet" href="/src/styles/components.css">
    <link rel="stylesheet" href="/src/styles/overlay.css">
    <!-- src/overlay/params.ts lists the URL's settings (?show=, ?streamer=, ?side=, ...) -->
    <script type="module" src="/src/overlay/index.ts"></script>
</head>
<body data-page="overlay">
    <!-- the weather card (src/overlay/weather.ts): the home page's weather tile, for a stream -->
    <section class="ov-weather" data-ov-card data-state="loading" aria-labelledby="ov-weather-title">
        <div class="weather-sky" data-weather-sky aria-hidden="true"></div>
        <div class="ov-weather__body">
            <h2 class="ov-weather__title" id="ov-weather-title">atmospheric conditions</h2>
            <div class="ov-weather__now">
                <!-- @svg weather-sun.svg class="ov-weather__sun weather-sun" -->
                <div class="ov-weather__reading">
                    <p class="ov-weather__big"><span data-weather-records>&ndash;</span> <span class="ov-weather__unit">rec/sec</span></p>
                    <p class="ov-weather__cond" data-weather-cond>checking the sky…</p>
                </div>
            </div>
            <div class="weather-spark ov-weather__spark" data-weather-spark aria-hidden="true"></div>
            <dl class="ov-weather__row">
                <div><dt>posts</dt><dd data-weather-posts>&ndash;</dd></div>
                <div><dt>likes</dt><dd data-weather-likes>&ndash;</dd></div>
                <div><dt>reposts</dt><dd data-weather-reposts>&ndash;</dd></div>
                <div><dt>follows</dt><dd data-weather-follows>&ndash;</dd></div>
            </dl>
            <div class="ov-weather__mix" data-weather-mix>
                <p class="ov-weather__mix-head">diversity index <strong data-weather-index>&ndash;</strong> <span class="ov-weather__level" data-weather-level></span></p>
                <div class="weather-ratio" aria-hidden="true">
                    <span class="weather-ratio__bsky" data-weather-bar-bsky></span><span class="weather-ratio__else" data-weather-bar-else></span>
                </div>
            </div>
            <p class="ov-weather__app" data-ov-app hidden><span class="ov-weather__app-label">busy elsewhere</span> <strong data-ov-app-domain></strong> <span data-ov-app-rate></span></p>
            <p class="ov-weather__foot">atpota.to/weather</p>
        </div>
    </section>

    <!-- the weather strip (?show=strip): the card's reading in one slim bar along the bottom -->
    <section class="ov-strip" data-ov-strip data-state="loading" aria-label="atmospheric conditions" hidden>
        <div class="weather-sky" data-weather-sky aria-hidden="true"></div>
        <div class="ov-strip__body">
            <!-- @svg weather-sun.svg class="ov-strip__sun weather-sun" -->
            <p class="ov-strip__big"><span data-weather-records>&ndash;</span> <span class="ov-strip__unit">rec/sec</span></p>
            <p class="ov-strip__cond" data-weather-cond>checking the sky…</p>
            <div class="weather-spark ov-strip__spark" data-weather-spark aria-hidden="true"></div>
            <dl class="ov-strip__row">
                <div><dt>posts</dt><dd data-weather-posts>&ndash;</dd></div>
                <div><dt>likes</dt><dd data-weather-likes>&ndash;</dd></div>
                <div><dt>follows</dt><dd data-weather-follows>&ndash;</dd></div>
            </dl>
            <p class="ov-strip__mix" data-weather-mix><span class="ov-strip__label">diversity</span> <strong data-weather-index>&ndash;</strong> <span class="ov-strip__level" data-weather-level></span></p>
            <p class="ov-strip__app" data-ov-app hidden><span class="ov-strip__label">busy elsewhere</span> <strong data-ov-app-domain></strong> <span data-ov-app-rate></span></p>
        </div>
    </section>

    <!-- Poe (src/overlay/poe.ts fills it in) -->
    <div class="ov-poe" data-ov-poe></div>
</body>
</html>
