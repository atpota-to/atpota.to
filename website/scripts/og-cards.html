<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <!-- The Open Graph cards (1200x630 each). og-cards.ts fills one template per card
         with the copy the pages show right now; `npm run og` (scripts/og-images.ts)
         screenshots them. Open /scripts/og-cards.html on the dev server to preview. -->
    <title>og cards - atpotato</title>
    <meta name="robots" content="noindex">

    <!-- Eigerdals (Adobe Fonts kit jik6ttx) -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin>
    <link rel="stylesheet" href="https://use.typekit.net/jik6ttx.css">

    <link rel="stylesheet" href="/src/styles/tokens.css">
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/components.css">
    <link rel="stylesheet" href="/src/styles/patch.css">
    <style>
        body {
            align-items: center;
            padding: 40px 0;
        }

        [data-og-root] {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .og {
            position: relative;
            flex: none;
            width: 1200px;
            height: 630px;
            padding: 28px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 470px;
            gap: 16px;
            overflow: hidden;
            background: var(--bg);
        }

        .og .tile {
            overflow: hidden;
            border-radius: 40px;
            isolation: isolate;
        }

        /* ---------- text tile ---------- */

        .og-text {
            --tile-pad: 50px 54px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: var(--paper);
        }

        .og-wordmark {
            display: block;
            flex: none;
            width: 160px;
            height: 40px;
            background: var(--brown);
            -webkit-mask: url(/src/assets/wordmark.svg) no-repeat left center / contain;
            mask: url(/src/assets/wordmark.svg) no-repeat left center / contain;
        }

        .og-top {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .og .chip {
            padding: 9px 18px 9px 14px;
            font-size: 19px;
        }

        .og .chip > svg,
        .og .chip > img {
            width: 22px;
        }

        /* padding-top keeps a gap under the wordmark when long copy fills the tile */
        .og-body {
            margin-top: auto;
            padding-top: 28px;
        }

        .og-title {
            margin: 0 0 22px;
            font-size: 80px;
            line-height: 0.98;
            letter-spacing: -0.03em;
            text-wrap: balance;
        }

        .og-lede {
            max-width: 22em;
            margin: 0;
            font-size: 27px;
            line-height: 1.36;
            color: var(--text-soft);
            text-wrap: pretty;
        }

        .og-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 26px;
            min-height: 46px;
            padding: 0 20px;
            border-radius: var(--radius-pill);
            background: var(--card);
            color: var(--text-soft);
            font-size: 20px;
            line-height: 1.2;
        }

        .og-pill b {
            color: var(--leaf);
        }

        .og-text--paper .og-pill {
            background: var(--bg);
        }

        /* ---------- art tiles: rays, a dirt mound, sprouts and a potato ---------- */

        .og-art {
            --tile-pad: 0;
            position: relative;
        }

        .og-rays {
            --ray-a: var(--sun);
            --ray-b: var(--sun-deep);
            background: repeating-conic-gradient(from 0deg at 50% 76%, var(--ray-a) 0deg 8deg, var(--ray-b) 8deg 16deg);
        }

        .og-rays--sage {
            --ray-a: var(--sage);
            --ray-b: #CFE7C1;
        }

        .og-mound {
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: -12px;
            z-index: 1;
            height: 160px;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            background: var(--skin);
        }

        .og-sprout {
            position: absolute;
            z-index: 2;
            height: auto;
        }

        .og-potato {
            position: absolute;
            z-index: 3;
            max-width: none;
            height: auto;
        }

        .og-bubble {
            position: absolute;
            z-index: 4;
            left: 30px;
            top: 30px;
            margin: 0;
            padding: 13px 20px;
            border-radius: 22px 22px 22px 6px;
            background: var(--card);
            color: var(--text-soft);
            max-width: 310px;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.3;
            text-wrap: balance;
        }

        /* the paper stack from the guide pages, scaled up */
        .og-stack {
            position: absolute;
            z-index: 1;
            width: 300px;
            height: 330px;
        }

        .og-sheet {
            position: absolute;
            width: 250px;
            border-radius: 26px;
            background: #FFFFFF;
        }

        .og-sheet--back {
            top: 14px;
            right: 44px;
            height: 290px;
            transform: rotate(-6deg);
        }

        .og-sheet--front {
            top: 0;
            right: 0;
            height: 300px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transform: rotate(4deg);
        }

        .og-bar {
            display: block;
            height: 12px;
            width: 100%;
            border-radius: 99px;
            background: var(--line);
        }

        .og-bar--title {
            height: 18px;
            width: 70%;
            background: var(--flesh);
        }

        .og-bar--86 {
            width: 86%;
        }

        .og-bar--92 {
            width: 92%;
        }

        .og-shot {
            display: block;
            height: 80px;
            width: 100%;
            border-radius: 16px;
            background: #D7F2FE;
        }

        /* ---------- home: the hero and the sunburst ---------- */

        .og--home .og-sprout--1 { left: 34px; bottom: 112px; width: 74px; }
        .og--home .og-sprout--2 { left: 100px; bottom: 124px; width: 48px; }
        .og--home .og-sprout--3 { right: 24px; bottom: 114px; width: 62px; }
        .og--home .og-potato { left: 50%; bottom: 112px; width: 350px; margin-left: -180px; }

        /* ---------- guides index ---------- */

        .og--guides .og-art {
            background: var(--flesh-tint);
        }

        .og--guides .og-stack { top: 36px; right: 84px; }
        .og--guides .og-potato { right: -28px; bottom: -84px; width: 340px; }

        /* ---------- one guide: the guide hero ---------- */

        .og--guide {
            grid-template-columns: minmax(0, 1fr);
        }

        .og--guide .og-text {
            background: var(--flesh-tint);
        }

        .og--guide .og-body {
            position: relative;
            z-index: 2;
            max-width: 690px;
        }

        .og--guide .og-title {
            font-size: 76px;
        }

        .og--guide .og-stack { top: 46px; right: 64px; }
        .og--guide .og-potato { right: -30px; bottom: -120px; width: 380px; }

        /* ---------- blog ---------- */

        .og--blog .og-sprout--1 { left: 28px; bottom: 114px; width: 70px; }
        .og--blog .og-sprout--2 { left: 92px; bottom: 126px; width: 44px; }
        .og--blog .og-sprout--3 { right: 22px; bottom: 112px; width: 58px; }
        .og--blog .og-potato { left: 50%; bottom: 112px; width: 350px; margin-left: -180px; }
        /* ---------- garden: a patch from above, planted with the garden's own flowers ---------- */

        .og--garden .og-art {
            background: var(--patch-path);
        }

        .og-patch {
            position: absolute;
            inset: 22px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 10px;
        }

        .og-plot {
            display: grid;
            place-items: center;
            border-radius: 20%;
            background: var(--patch-mound);
        }

        .og-plot--empty::after {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--patch-seed);
        }

        .og-plot .home-flower {
            width: 92%;
            height: 92%;
            overflow: visible;
        }

        .og--garden .og-body {
            position: relative;
            z-index: 2;
            max-width: 400px;
        }

        .og--garden .og-potato { right: -30px; bottom: -76px; width: 250px; }

        /* ---------- poe: say hi, with a chat going on the sunburst ---------- */

        .og-chat {
            position: absolute;
            z-index: 4;
            left: 26px;
            right: 26px;
            top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .og-chat .og-bubble {
            position: static;
            max-width: 330px;
        }

        .og-chat .og-bubble--you {
            align-self: flex-end;
            border-radius: 22px 22px 6px 22px;
            background: var(--leaf-pill);
            color: var(--leaf-strong);
        }

        .og-heart {
            position: absolute;
            z-index: 4;
            width: 40px;
            height: auto;
            color: var(--blush);
        }

        .og-heart--1 { right: 54px; bottom: 300px; width: 44px; transform: rotate(14deg); }
        .og-heart--2 { right: 104px; bottom: 344px; width: 28px; transform: rotate(-10deg); }

        /* the home hero's meadow (src/styles/home.css, .home-sun__mound), out of season */
        .og-mound--meadow {
            --ground: #B9DE93;
            background:
                radial-gradient(56.6% 94% at 50% 136%, color-mix(in srgb, var(--ground), #4C7A33 26%) 99%, transparent 100%),
                var(--ground);
        }

        .og-tuft {
            position: absolute;
            z-index: 2;
            width: 26px;
            height: 26px;
            margin-left: -13px;
            background: color-mix(in srgb, var(--ground, #B9DE93), #2F5A22 50%);
            -webkit-mask: url(/src/assets/scene/tuft.svg) center / contain no-repeat;
            mask: url(/src/assets/scene/tuft.svg) center / contain no-repeat;
        }

        .og-tuft--front { z-index: 4; }

        .og-shadow {
            position: absolute;
            z-index: 2;
            left: 50%;
            bottom: 96px;
            width: 220px;
            height: 26px;
            margin-left: -114px;
            border-radius: 50%;
            background: radial-gradient(closest-side, rgba(42, 30, 16, 0.2), transparent);
        }

        .og--poe .og-sprout--1 { left: 28px; bottom: 114px; width: 70px; }
        .og--poe .og-sprout--3 { right: 22px; bottom: 112px; width: 58px; }
        .og--poe .og-potato { left: 50%; bottom: 100px; width: 320px; margin-left: -170px; }
    </style>
</head>
<body>
    <main data-og-root></main>

    <!-- public/og/home.png: the home page, and the fallback for every other page -->
    <template data-og-kind="home">
        <section class="og og--home">
            <div class="tile og-text og-text--paper">
                <span class="og-wordmark" role="img" aria-label="atpotato"></span>
                <div class="og-body">
                    <h1 class="og-title" data-slot="title"></h1>
                    <p class="og-lede" data-slot="lede"></p>
                </div>
            </div>
            <div class="tile og-art og-rays">
                <p class="og-bubble" data-slot="bubble"></p>
                <div class="og-mound"></div>
                <img class="og-sprout og-sprout--1" src="/src/assets/sprout.svg" alt="">
                <img class="og-sprout og-sprout--2" src="/src/assets/sprout.svg" alt="">
                <img class="og-sprout og-sprout--3" src="/src/assets/sprout.svg" alt="">
                <img class="og-potato" src="/src/assets/mascot/potato-kawaii.svg" alt="">
            </div>
        </section>
    </template>

    <!-- public/og/guides.png: /guides -->
    <template data-og-kind="guides">
        <section class="og og--guides">
            <div class="tile og-text og-text--paper">
                <span class="chip"><img src="/src/assets/leaf.svg" alt=""><span data-slot="chip"></span></span>
                <div class="og-body">
                    <h1 class="og-title" data-slot="title"></h1>
                    <p class="og-lede" data-slot="lede"></p>
                </div>
            </div>
            <div class="tile og-art">
                <div class="og-stack">
                    <span class="og-sheet og-sheet--back"></span>
                    <span class="og-sheet og-sheet--front">
                        <span class="og-bar og-bar--title"></span>
                        <span class="og-bar"></span>
                        <span class="og-bar og-bar--86"></span>
                        <span class="og-shot"></span>
                        <span class="og-bar og-bar--92"></span>
                    </span>
                </div>
                <img class="og-potato" src="/src/assets/mascot/potato-happy.svg" alt="">
            </div>
        </section>
    </template>

    <!-- public/og/<slug>.png: each guide listed on /guides -->
    <template data-og-kind="guide">
        <section class="og og--guide">
            <div class="tile og-text">
                <div class="og-top">
                    <span class="og-wordmark" role="img" aria-label="atpotato"></span>
                    <span class="chip"><img src="/src/assets/leaf.svg" alt="">guides</span>
                </div>
                <div class="og-body">
                    <h1 class="og-title" data-slot="title"></h1>
                    <p class="og-lede" data-slot="lede"></p>
                    <p class="og-pill">written by <b data-slot="handle"></b></p>
                </div>
                <div class="og-stack">
                    <span class="og-sheet og-sheet--back"></span>
                    <span class="og-sheet og-sheet--front">
                        <span class="og-bar og-bar--title"></span>
                        <span class="og-bar"></span>
                        <span class="og-bar og-bar--86"></span>
                        <span class="og-shot"></span>
                        <span class="og-bar og-bar--92"></span>
                    </span>
                </div>
                <img class="og-potato" src="/src/assets/mascot/potato-wow.svg" alt="">
            </div>
        </section>
    </template>

    <!-- public/og/blog.png: /blog, and posts without a cover image -->
    <template data-og-kind="blog">
        <section class="og og--blog">
            <div class="tile og-text og-text--paper">
                <div class="og-top">
                    <span class="og-wordmark" role="img" aria-label="atpotato"></span>
                    <span class="chip" data-slot="chip"></span>
                </div>
                <div class="og-body">
                    <h1 class="og-title" data-slot="title"></h1>
                    <p class="og-lede" data-slot="lede"></p>
                    <p class="og-pill">by <b data-slot="handle"></b></p>
                </div>
            </div>
            <div class="tile og-art og-rays og-rays--sage">
                <div class="og-mound"></div>
                <img class="og-sprout og-sprout--1" src="/src/assets/sprout.svg" alt="">
                <img class="og-sprout og-sprout--2" src="/src/assets/sprout.svg" alt="">
                <img class="og-sprout og-sprout--3" src="/src/assets/sprout.svg" alt="">
                <img class="og-potato" src="/src/assets/mascot/potato-happy.svg" alt="">
            </div>
        </section>
    </template>

    <!-- public/og/garden.png: /garden and everyone's own garden -->
    <template data-og-kind="garden">
        <section class="og og--garden">
            <div class="tile og-text og-text--paper">
                <span class="og-wordmark" role="img" aria-label="atpotato"></span>
                <div class="og-body">
                    <h1 class="og-title" data-slot="title"></h1>
                    <p class="og-lede" data-slot="lede"></p>
                </div>
                <img class="og-potato" src="/src/assets/mascot/potato-wink.svg" alt="">
            </div>
            <div class="tile og-art">
                <div class="og-patch" data-og-patch></div>
            </div>
        </section>
    </template>

    <!-- public/og/poe.png: the share card for chatting with (and petting) Poe -->
    <template data-og-kind="poe">
        <section class="og og--poe">
            <div class="tile og-text og-text--paper">
                <div class="og-top">
                    <span class="og-wordmark" role="img" aria-label="atpotato"></span>
                    <span class="chip">ask poe</span>
                </div>
                <div class="og-body">
                    <h1 class="og-title" data-slot="title"></h1>
                    <p class="og-lede" data-slot="lede"></p>
                    <p class="og-pill">on bluesky too: <b data-slot="handle"></b></p>
                </div>
            </div>
            <div class="tile og-art og-rays">
                <div class="og-chat">
                    <p class="og-bubble og-bubble--you">what's a lexicon?</p>
                    <p class="og-bubble">the schema for a kind of record, like a recipe card for data (◕‿◕)</p>
                </div>
                <svg class="og-heart og-heart--1" viewBox="0 0 24 22" aria-hidden="true"><path fill="currentColor" d="M12 21.3 10.5 20C5.1 15.1 1.5 11.9 1.5 7.9 1.5 4.7 4 2.2 7.2 2.2c1.8 0 3.6.8 4.8 2.2 1.2-1.4 3-2.2 4.8-2.2 3.2 0 5.7 2.5 5.7 5.7 0 4-3.6 7.2-9 12.1L12 21.3Z"/></svg>
                <svg class="og-heart og-heart--2" viewBox="0 0 24 22" aria-hidden="true"><path fill="currentColor" d="M12 21.3 10.5 20C5.1 15.1 1.5 11.9 1.5 7.9 1.5 4.7 4 2.2 7.2 2.2c1.8 0 3.6.8 4.8 2.2 1.2-1.4 3-2.2 4.8-2.2 3.2 0 5.7 2.5 5.7 5.7 0 4-3.6 7.2-9 12.1L12 21.3Z"/></svg>
                <div class="og-mound og-mound--meadow"></div>
                <span class="og-tuft" style="left: 5%; bottom: 74px"></span>
                <span class="og-tuft" style="left: 27%; bottom: 120px"></span>
                <span class="og-tuft" style="left: 73%; bottom: 120px"></span>
                <span class="og-tuft" style="left: 95%; bottom: 72px"></span>
                <span class="og-shadow"></span>
                <img class="og-sprout og-sprout--1" src="/src/assets/sprout.svg" alt="">
                <img class="og-sprout og-sprout--3" src="/src/assets/sprout.svg" alt="">
                <img class="og-potato" src="/src/assets/mascot/potato-happy.svg" alt="">
                <span class="og-tuft og-tuft--front" style="left: calc(50% - 76px); bottom: 92px"></span>
                <span class="og-tuft og-tuft--front" style="left: calc(50% + 60px); bottom: 92px"></span>
            </div>
        </section>
    </template>

    <script type="module" src="/scripts/og-cards.ts"></script>
</body>
</html>
